ms:center;color:white;font-size:10px}.cc.emi{background:var(--sage)}.cc.david{background:var(--david)}.event{display:grid;grid-template-columns:44px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.edate{background:var(--sage2);border-radius:10px;text-align:center;padding:6px 2px}.edate b{display:block;font-family:var(--serif);font-size:16px}.edate small{font-size:8px;color:var(--muted)}.event strong{font-family:var(--serif);font-weight:500}.event small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.common{display:grid;grid-template-columns:1fr 1fr;gap:9px}.commoncard{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px;min-height:112px}.commoncard span{font-size:20px}.commoncard strong{font-family:var(--serif);font-weight:500;display:block;margin-top:14px}.commoncard small{font-size:9px;color:var(--muted)}.season{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px;margin-bottom:9px}.season strong{font-family:var(--serif);font-weight:500}.season small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);height:80px;background:rgba(255,253,248,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 68px minmax(0,1fr) minmax(0,1.15fr);align-items:center;padding:7px 5px max(7px,env(safe-area-inset-bottom))}.bottom button{border:0;background:none;min-width:0;color:#767872;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 1px}.bottom small{font-size:9px;white-space:nowrap}.bottom button.active{color:var(--sage);font-weight:850}.plus{width:56px;height:56px;border-radius:50%!important;background:var(--sage)!important;color:white!important;font-size:31px!important;display:grid!important;place-items:center!important;margin-top:-18px;justify-self:center}dialog{border:0;padding:0;background:transparent;width:min(560px,100%);max-width:none}dialog::backdrop{background:rgba(42,42,37,.42);backdrop-filter:blur(3px)}.sheet{background:var(--paper);border-radius:26px 26px 0 0;padding:13px 19px 27px;position:relative;max-height:88vh;overflow:auto}.grab{width:36px;height:4px;border-radius:999px;background:#ccc5ba;margin:0 auto 17px}.close{position:absolute;right:16px;top:13px;border:0;background:none;font-size:27px}.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;margin:5px 0 10px}.sheet textarea{min-height:82px}.field{font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#5c6458;margin-top:7px}@media(max-width:370px){#app{padding-left:16px;padding-right:16px}.bottom{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) 62px minmax(0,1fr) minmax(0,1.12fr);padding-left:2px;padding-right:2px}.bottom small{font-size:8px}.plus{width:52px;height:52px;font-size:29px!important}.domains{grid-template-columns:1fr}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app"),dlg=$("#dlg"),body=$("#body");
const db={g(k,f){try{let v=localStorage.getItem("ghu_"+k);return v===null?f:JSON.parse(v)}catch{return f}},s(k,v){localStorage.setItem("ghu_"+k,JSON.stringify(v))}};
const D={
 focus:"Reset the kitchen before dinner.",
 tasks:[{id:1,text:"Start one load of laundry",done:false},{id:2,text:"Water seedlings",done:false},{id:3,text:"Pray",done:false}],

 goals:[{id:"talk",text:"Build longer back-and-forth conversations",why:"Pause, listen, expand what he says, and ask one natural follow-up.",done:false},{id:"ind",text:"Practice one everyday self-help job",why:"Dressing, carrying belongings, food prep, or cleaning up.",done:false},{id:"play",text:"Grow pretend and cooperative play",why:"Follow his idea and add just enough to keep the play going.",done:false}],
 obs:[],
 cleaning:{Daily:[["d1","Dishes & sink clear","Kitchen"],["d2","Counters & table wiped","Kitchen & dining"],["d3","One load of laundry","Wash, dry or fold"],["d4","Tidy main living space","Quick pickup"]],Weekly:[["w1","Bathrooms","Sink, toilet, tub & towels"],["w2","Floors","Vacuum, sweep & mop"],["w3","Bedding & linens","Sheets, towels & refresh"],["w4","Kitchen deep reset","Fridge check, fronts & sink"]],Monthly:[["m1","Appliance care","Wipe, inspect & maintain"],["m2","Dust overlooked places","Fans, vents & trim"],["m3","Declutter one small zone","A drawer, shelf or basket"]],Seasonal:[["s1","Seasonal home reset","Rotate clothing & household items"],["s2","Safety check","Detectors & emergency supplies"],["s3","Outdoor transition","Porch, garden & weather prep"]]}
};
for(const [k,v] of Object.entries(D))if(localStorage.getItem("ghu_"+k)===null)db.s(k,v);
let cleanTab="Daily",ctab="overview",ideaFilter="All";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function bind(){$$("[data-route]").forEach(b=>b.onclick=()=>R[b.dataset.route]());$$("[data-back]").forEach(b=>b.onclick=()=>R[b.dataset.back]())}

function mark(){let a=db.g("rhythm",[]),t=new Date().toISOString().slice(0,10);if(!a.includes(t)){a.push(t);db.s("rhythm",a)}}
function rhythm(){let a=new Set(db.g("rhythm",[])),n=new Date(),s=new Date(n),d=(n.getDay()+6)%7;s.setDate(n.getDate()-d);s.setHours(0,0,0,0);let c=0;return {c,html:["M","T","W","T","F","S","S"].map((x,i)=>{let q=new Date(s);q.setDate(s.getDate()+i);let k=q.toISOString().slice(0,10),z=a.has(k);if(z)c++;return `<div class="rday ${z?"done":""}">${x}<i>${z?"✓":""}</i></div>`}).join("")}}
function today(){active("today");let r=rhythm(),t=db.g("tasks",D.tasks),done=t.filter(x=>x.done).length;app.innerHTML=`<div class="eyebrow">Gathered</div><h1>Good morning,<br>Emi</h1><div class="date">${date()}</div>
<div class="card"><div class="eyebrow">Gathered rhythm</div><div class="rhythm">${r.html}</div><div class="meta"><span>${r.c} days in rhythm this week</span><span>·</span><span>A gentle record, not a requirement</span></div></div>
<div class="card soft focus"><div><div class="eyebrow">Today's focus</div><h2>${esc(db.g("focus",D.focus))}</h2><div class="inline"><span class="pill">◷ 10 min</span><button class="textbtn" id="reset">Start reset</button></div></div><button class="spark" id="editfocus">✦</button></div>
<div class="section"><strong>Today at a glance</strong></div><div class="list">
<button class="rowbtn" id="tend"><span class="icon">✓</span><span class="copy"><strong>Tending</strong><small>${done} of ${t.length} tasks done</small></span><span class="chev">›</span></button>
<button class="rowbtn" id="din"><span class="icon">♨</span><span class="copy"><strong>Dinner</strong><small>${esc(db.g("dinner",D.dinner))}</small></span><span class="chev">›</span></button>
<button class="rowbtn" data-route="household"><span class="icon">⌂</span><span class="copy"><strong>For your home</strong><small>Find your main water shutoff</small></span><span class="chev">›</span></button>
<button class="rowbtn" id="verse"><span class="icon">✝</span><span class="copy"><strong>Scripture</strong><small>Colossians 3:23</small></span><span class="chev">›</span></button></div>
<div class="section"><strong>Coming up</strong><button id="cal">Calendar preview ›</button></div><div class="card"><div class="event"><div class="edate"><small>SEP</small><b>11</b></div><div><strong>Worship in the Pines</strong><small>Family event · Saratoga Springs</small></div></div><div class="event"><div class="edate"><small>THU</small><b>10</b></div><div><strong>Crafts & Colossians</strong><small>Weekly rhythm · 10:00 AM</small></div></div></div>`;bind();$("#reset").onclick=resetSheet;$("#editfocus").onclick=focusSheet;$("#tend").onclick=tendSheet;$("#din").onclick=dinnerSheet;$("#verse").onclick=faith;$("#cal").onclick=calendarSheet}
function faith(){active("today");app.innerHTML=`${top("Scripture","today")}<div class="eyebrow" style="text-align:center">Today's word</div><h1 style="font-size:35px;text-align:center;margin-top:8px">Colossians 3:23</h1><div class="quote">Whatever you do, work heartily, as for the Lord and not for men.</div><div class="muted" style="text-align:center;font-size:10px">World English Bible · public domain</div><div class="actions3"><button class="action" id="reflect"><span>♡</span><small>Reflect</small></button><button class="action" id="highlight"><span>✎</span><small>Highlight</small></button><button class="action" id="note"><span>▤</span><small>Note</small></button></div><div class="section"><strong>Go deeper</strong></div><div class="list"><button class="rowbtn" id="read"><span class="icon">▥</span><span class="copy"><strong>Read Colossians 3</strong><small>Read the full chapter</small></span><span class="chev">›</span></button><button class="rowbtn" id="prev"><span class="icon">◷</span><span class="copy"><strong>Previous Scriptures</strong><small>See your daily journey</small></span><span class="chev">›</span></button><button class="rowbtn" id="lesson"><span class="icon">✦</span><span class="copy"><strong>Bible lessons</strong><small>Grow in the Word</small></span><span class="chev">›</span></button></div>`;bind();$("#reflect").onclick=$("#note").onclick=noteSheet;$("#highlight").onclick=()=>{mark();$("#highlight small").textContent="Highlighted"};$("#read").onclick=reader;$("#prev").onclick=previousSheet;$("#lesson").onclick=()=>simple("Bible lesson","Faithfulness in ordinary work",`<p class="muted">Read Colossians 3:12–24 and notice how Paul connects everyday relationships and work with serving Christ.</p>`)}
function reader(){app.innerHTML=`${top("Colossians 3","faith")}<div class="reader">${["If then you were raised together with Christ, seek the things that are above, where Christ is, seated on the right hand of God.","Set your mind on the things that are above, not on the things that are on the earth.","For you died, and your life is hidden with Christ in God.","When Christ, our life, is revealed, then you will also be revealed with him in glory.","Put to death therefore your members which are on the earth: sexual immorality, uncleanness, depraved passion, evil desire, and covetousness, which is idolatry.","For these things’ sake the wrath of God comes on the children of disobedience.","You also once walked in those, when you lived in them."].map((v,i)=>`<div class="verse ${db.g("highlights",[]).includes(i+1)?"hi":""}" data-v="${i+1}"><span class="vnum">${i+1}</span>${esc(v)}</div>`).join("")}</div>`;bind();$$("[data-v]").forEach(x=>x.onclick=()=>{let h=db.g("highlights",[]),n=+x.dataset.v;h=h.includes(n)?h.filter(v=>v!==n):[...h,n];db.s("highlights",h);reader()})}

function ideaSheet(t){let i=Ideas.find(x=>x[1]===t);open(`<div class="eyebrow">${i[0]} · ${i[2]}</div><h2>${i[1]}</h2><p class="muted">${i[3]}</p><div class="note"><b>Why this belongs here:</b> ordinary play and responsive interaction practice useful skills without turning home into a classroom.</div><button class="primary" style="margin-top:12px" id="itoday">Add to Today</button>`);$("#itoday").onclick=()=>{let a=db.g("tasks",D.tasks);a.push({id:Date.now(),text:i[1],done:false});db.s("tasks",a);dlg.close();mark()}}
function waterSheet(){open(`<div class="eyebrow">Save to my home</div><h2>Where is your shutoff?</h2><input id="wl" value="${esc(db.g("waterLoc",""))}" placeholder="Basement, front wall beside meter"><textarea id="wn" placeholder="Optional note">${esc(db.g("waterNote",""))}</textarea><button class="primary" id="sw">Save location</button>`);$("#sw").onclick=()=>{db.s("waterLoc",$("#wl").value.trim());db.s("waterNote",$("#wn").value.trim());let r=db.g("refs",D.refs),x=r.find(v=>v.label==="Main water shutoff");x.value=$("#wl").value.trim()||"Location saved";db.s("refs",r);let h=db.g("history",[]);h.unshift({title:"Main water shutoff located",date:new Date().toISOString()});db.s("history",h);mark();dlg.close()}}
function projectSheet(){open(`<div class="eyebrow">Projects & Repairs</div><h2>Add a project</h2><input id="pt" placeholder="Repair bathroom trim"><input id="pa" placeholder="Room or area"><button class="primary" id="sp">Save project</button>`);$("#sp").onclick=()=>{let v=$("#pt").value.trim();if(v){let a=db.g("projects",D.projects);a.unshift({id:Date.now(),title:v,status:"Planning",area:$("#pa").value.trim()||"Home"});db.s("projects",a);dlg.close();projects()}}}
function systemSheet(id){let a=db.g("systems",D.systems),x=a.find(v=>v.id===id);open(`<div class="eyebrow">Systems & Appliances</div><h2>${x?"Edit":"Add"} equipment</h2><input id="sn" value="${x?esc(x.name):""}" placeholder="Dishwasher"><textarea id="sd">${x?esc(x.detail):""}</textarea><button class="primary" id="ss">Save</button>`);$("#ss").onclick=()=>{let n=$("#sn").value.trim();if(n){let arr=db.g("systems",D.systems);if(x){x.name=n;x.detail=$("#sd").value.trim()||"No details saved yet"}else arr.push({id:Date.now(),name:n,detail:$("#sd").value.trim()||"No details saved yet"});db.s("systems",arr);dlg.close();systems()}}}
function refSheet(){open(`<div class="eyebrow">Home Reference</div><h2>Save something useful</h2><input id="rl" placeholder="Paint color"><input id="rv" placeholder="Living room · Warm White"><button class="primary" id="sr">Save reference</button>`);$("#sr").onclick=()=>{let l=$("#rl").value.trim();if(l){let a=db.g("refs",D.refs);a.unshift({id:Date.now(),label:l,value:$("#rv").value.trim()});db.s("refs",a);dlg.close();reference()}}}
function cleanSheet(){open(`<div class="eyebrow">${cleanTab} reset</div><h2>Add a cleaning task</h2><input id="ct" placeholder="Task"><input id="cs" placeholder="Room or note"><button class="primary" id="sc">Add task</button>`);$("#sc").onclick=()=>{let v=$("#ct").value.trim();if(v){let c=db.g("cleaning",D.cleaning);c[cleanTab].push([String(Date.now()),v,$("#cs").value.trim()]);db.s("cleaning",c);dlg.close();renderCleaning()}}}
function quickSheet(){open(`<div class="eyebrow">Quick add</div><h2>Get it out of your head.</h2><select id="qt"><option>Today</option><option>Commonplace</option><option>Household</option></select><input id="qv" placeholder="Something to remember..."><button class="primary" id="sq">Save</button>`);$("#sq").onclick=()=>{let v=$("#qv").value.trim();if(v&&$("#qt").value==="Today"){let a=db.g("tasks",D.tasks);a.push({id:Date.now(),text:v,done:false});db.s("tasks",a)}dlg.close()}}
$$("[data-nav]").forEach(b=>b.onclick=()=>R[b.dataset.nav]());$("#quick").onclick=quickSheet;
today();
</script>
</body>
</html>
